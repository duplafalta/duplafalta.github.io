<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>Dupla Falta - CINCATE - São Gabriel da Palha - ES</title>
  <meta name="description" content="Associação de Tenistas em São Gabriel da Palha - ES">

  <!-- Open Graph / Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Dupla Falta - Associação de Tenistas em São Gabriel da Palha - ES">
  <meta property="og:image" content="">

  <link rel="shortcut icon" href="https://duplafalta.com.br/menu/assets/images/logo-256x256.png" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

  <!-- Scripts do sistema original -->
  <script src="https://duplafalta.com.br/menu/principal/principal.js"></script>
  <script src="https://duplafalta.com.br/zani-imoveis-open/2026/menu/zani.js"></script>
  <script src="https://duplafalta.com.br/zani-imoveis-open/menu-topo/zanitopo.js"></script>

  <style>
    :root {
      --bg-dark: #333333;
      --bg-light: #EFEFEF;
      --bg-red: #AF0204;
      --primary-blue: #149DCC;
      --text-dark: #434343;
      --border-color: #e0e0e0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Roboto', Arial, sans-serif;
      background-color: var(--bg-light);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Topo / Header principal */
    .site-header {
      background-color: var(--bg-dark);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      padding: 15px 20px;
      gap: 15px;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .logo-main img {
      width: 75px;
      height: 75px;
      object-fit: contain;
      display: block;
    }

    .header-title {
      font-weight: 700;
      font-size: 1rem;
      max-width: 300px;
      color: #ffffff;
    }

    .principal-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      min-width: 200px;
    }

    .btn-associe {
      background-color: var(--primary-blue);
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      padding: 12px 24px;
      border-radius: 4px;
      transition: opacity 0.2s ease-in-out;
      text-align: center;
    }

    .btn-associe:hover {
      opacity: 0.9;
    }

    /* Menus dinâmicos superiores e secundários */
    .nav-container {
      background-color: var(--bg-light);
      padding: 10px;
      display: flex;
      justify-content: center;
      border-bottom: 1px solid var(--border-color);
    }

    /* Banners e Imagens Principais */
    .banner-section {
      background-color: var(--bg-red);
      padding: 20px 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
    }

    .banner-section img,
    .champions-section img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    /* Área do torneio / Campeões */
    .champions-section {
      background-color: var(--bg-red);
      padding: 40px 10px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Rodapé */
    .site-footer {
      background-color: var(--bg-light);
      border-top: 1px solid #999999;
      color: var(--text-dark);
      text-align: center;
      padding: 20px;
      margin-top: auto;
    }

    .site-footer p {
      font-size: 0.9rem;
      margin-bottom: 5px;
    }

    .site-footer span {
      font-size: 0.8rem;
    }

    /* Responsividade para telas menores */
    @media (max-width: 768px) {
      .site-header {
        flex-direction: column;
        text-align: center;
      }

      .brand-group {
        flex-direction: column;
      }

      .header-title {
        max-width: 100%;
      }

      .btn-associe {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <!-- Cabeçalho Principal -->
  <header class="site-header">
    <div class="brand-group">
      <a href="https://duplafalta.com.br/index.html" class="logo-main" target="_top">
        <img src="https://duplafalta.com.br/images/topo/logo-95x95.png" alt="Logo Dupla Falta" width="95" height="95">
      </a>
      <p class="header-title">Associação de Tenistas em São Gabriel da Palha - ES</p>
    </div>

    <div class="principal-container">
      <!-- Injeção via principal.js -->
      <div id="principal"></div>
    </div>

    <a href="https://duplafalta.com.br/associacao/index.html" class="btn-associe">Associe-se</a>
  </header>

  <!-- Container Zani Topo -->
  <nav class="nav-container">
    <div id="zanitopo"></div>
  </nav>

  <!-- Banner do Torneio 2026 -->
  <section class="banner-section">
    <a href="index.html" target="_top">
      <img src="images/logo-2026.png" alt="Logo Zani Imóveis Open 2026" width="400" height="100">
    </a>
  </section>

  <!-- Container Zani Sub-menu -->
  <nav class="nav-container">
    <div id="zani"></div>
  </nav>

  <!-- Área de Campeões/Programação -->
  <main class="champions-section">
    <div id="campeoes">
      <a href="programacao-simples.html" target="_top">
        <img src="images/programacao-e-resultados.png" title="Zani Imoveis Open 2026" alt="Programação e Resultados" width="450" height="270">
      </a>
    </div>
  </main>

  <!-- Rodapé -->
  <footer class="site-footer">
    <p><strong>Dupla Falta - Associação de Tenistas em São Gabriel da Palha - ES</strong></p>
    <span>Todos os direitos reservados - Fundada em 04/07/2013</span>
  </footer>

</body>
</html>
